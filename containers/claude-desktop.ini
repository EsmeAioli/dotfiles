# claude-desktop: unofficial Claude desktop build (claude-desktop-debian project)
#   in a Fedora 43 toolbox, exported to the host app menu.
#
# Gotcha: links in the app didn't open. The app runs from
#   /usr/lib/claude-desktop-unofficial, host-spawn reuses that working
#   directory on the host, the folder doesn't exist there -> silent fail.
# Fix: xdg-open wrapper, kept at ~/.config/distrobox/xdg-open-wrapper:
#     #!/bin/sh
#     cd "$HOME"
#     exec /usr/bin/distrobox-host-exec xdg-open "$@"
#   Debugged with: strace -f -e trace=execve, then diffing env.
[claude-desktop]
image=registry.fedoraproject.org/fedora-toolbox:43
additional_packages="curl nss nspr atk at-spi2-atk cups-libs libdrm libxkbcommon libXcomposite libXdamage libXfixes libXrandr mesa-libgbm alsa-lib cairo cairo-gobject pango gtk3 libX11 libXcursor libXext libXi libXtst dbus-libs"
init_hooks="curl -fsSL https://pkg.claude-desktop-debian.dev/rpm/claude-desktop-unofficial.repo -o /etc/yum.repos.d/claude-desktop.repo && dnf install -y claude-desktop-unofficial && distrobox-export --app /usr/bin/claude-desktop-unofficial"